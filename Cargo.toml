[package]
name = "freeoxide-tunnel"
version = "0.1.0"
edition = "2024"
# MSRV 1.88: comfy-table 7.2.2 uses let-chains (stabilized in 1.88). The pin
# makes any toolchain or dependency floor raise fail CI instead of shipping.
rust-version = "1.88"
description = "Expose local and static services through temporary tunnels."
repository = "https://github.com/freeoxide/tunnel"
homepage = "https://tunnel.freeoxide.com"
license = "MIT"
readme = "README.md"
keywords = ["tunnel", "cloudflare", "cli", "static-server", "localhost"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ft"
path = "src/main.rs"

# Bench ids the perf campaign parses (e.g. `listing/render_1000_plain`) are
# contractual; keep them stable.
[[bench]]
name = "listing"
harness = false

[[bench]]
name = "drop_listing"
harness = false

[[bench]]
name = "guard"
harness = false

[[bench]]
name = "hook_store"
harness = false

[[bench]]
name = "registry_cycle"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1

# Release mirrors the bench codegen pins so the shipped binary measures the
# same code shape; deliberately NO `panic` setting (foreground flows unwind
# through EntryGuard's Drop in cmd/start.rs) and no target-cpu pin anywhere.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
# `clock` stays OFF: it pulls iana-time-zone → CoreFoundation on macOS, which
# breaks zig cross-linking; UTC "now" comes from SystemTime via model::now_utc.
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
comfy-table = "7.2.2"
directories = "6.0.0"
# Registry advisory locking: flock(2) on Unix, LockFileEx on Windows (raw
# libc::flock does not exist there).
fs2 = "0.4"
open = "5.3.5"
# Percent-decode the request path in the static-server confinement guard so our
# path resolution matches tower-http ServeDir's.
percent-encoding = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
# toride is pinned by git rev (unpublished). The `version` field only satisfies
# cargo-deny's wildcard ban — it changes no resolution and must track toride's
# own crate version.
toride-runner = { version = "0.1.0", git = "https://github.com/freeoxide/toride", rev = "186b84e32cb154bb0feeee2b459cee8940c3b305", default-features = false }
tower-http = { version = "0.7.0", features = ["fs", "trace", "timeout", "limit", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
# tokio test harness; "test-util" is not part of the "full" feature set.
tokio = { version = "1.52.3", features = ["test-util", "macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
# Bench harness, pinned EXACTLY (=0.8.2): saved baselines must not silently
# compare across criterion versions.
criterion = { version = "=0.8.2", features = ["html_reports"] }
