name: latest

# release.yml triggers only on `v*` tags, so the two workflows never publish
# the same release — a division of labor this YAML cannot reference.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: latest-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Same cross-compile matrix as release.yml:29-47 — a parity the YAML
        # cannot reference.
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tgz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tgz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tgz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tgz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          # Separate cache namespace from release.yml's `release-` key so a
          # corrupted rolling-build cache can never affect a tagged release.
          key: latest-${{ matrix.target }}

      # aarch64 musl links with rust-lld: Ubuntu ships no
      # gcc-aarch64-linux-musl package, and rust-lld cannot compile C — a
      # future -sys dependency needs a real cross toolchain (cross/zig).
      - name: Install musl toolchain (x86_64 musl only)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Configure musl cross-linker
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-musl)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build (release, locked, target)
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Package the binary ALONE at the archive root so installers can extract
      # straight into ~/.local/bin or $InstallDir. No README, no Cargo.lock —
      # exactly what the binstall metadata promises.
      - name: Stage & archive (unix)
        if: matrix.archive == 'tgz'
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/ft" staging/ft
          tar -czf "freeoxide-tunnel-${{ matrix.target }}.tgz" -C staging ft
          sha256sum "freeoxide-tunnel-${{ matrix.target }}.tgz" \
            | awk '{print $1}' > "freeoxide-tunnel-${{ matrix.target }}.tgz.sha256"

      - name: Stage & archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ft.exe" "staging/ft.exe"
          Compress-Archive -Path staging/ft.exe -DestinationPath "freeoxide-tunnel-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "freeoxide-tunnel-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "freeoxide-tunnel-${{ matrix.target }}.zip.sha256" -Value $hash

      - name: Upload archive + sidecar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asset-${{ matrix.target }}
          if-no-files-found: error
          path: |
            freeoxide-tunnel-${{ matrix.target }}.tgz
            freeoxide-tunnel-${{ matrix.target }}.tgz.sha256
            freeoxide-tunnel-${{ matrix.target }}.zip
            freeoxide-tunnel-${{ matrix.target }}.zip.sha256

  # Enforces the deny.toml policy (yanked = "deny", deny.toml:3) on the
  # publishable "latest" artifacts — the same gate ci.yml runs, so the
  # rolling snapshot is never weaker than PR CI.
  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny (advisories, bans, licenses, sources)
        run: cargo deny check advisories bans licenses sources
      - name: cargo-audit
        run: cargo audit

  # ci.yml has no shellcheck/sh -n: this job is the only installer lint
  # gate before install.sh/install.ps1 ship on `latest`.
  lint-scripts:
    name: lint install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: sh -n install.sh
        run: sh -n install.sh

      - name: shellcheck install.sh
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck install.sh

  lint-scripts-windows:
    name: lint install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Parse-check install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = Get-Content -Raw -Path install.ps1
          [void][ScriptBlock]::Create($content)
          Write-Output "install.ps1 parses cleanly"

  publish:
    name: override latest release
    runs-on: ubuntu-latest
    needs: [build, supply-chain, lint-scripts, lint-scripts-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download all per-target assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      - name: Stage installers
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1

      # Checksum line format install.sh:157 and install.ps1:142-149 parse:
      # "<hash>  <filename>" — two spaces, basename only.
      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          : > SHA256SUMS
          for sidecar in *.sha256; do
            asset="${sidecar%.sha256}"
            hash="$(cat "$sidecar" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$asset" >> SHA256SUMS
          done
          sort -k2 SHA256SUMS -o SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Verify SHA256SUMS against archives
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # softprops/action-gh-release resolves the release by tag_name and
      # replaces same-named assets on every run — the overwrite that keeps
      # /releases/download/latest/... tracking HEAD.
      - name: Overwrite latest release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: latest
          name: Latest build
          body: |
            Rolling build from `main`, rebuilt and overwritten on every push.
            Commit: ${{ github.sha }}

            This is **not** a stable release — for versioned releases see
            https://github.com/freeoxide/tunnel/releases
          prerelease: true
          make_latest: "false"
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/freeoxide-tunnel-*.tgz
            dist/freeoxide-tunnel-*.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
            dist/freeoxide-tunnel-*.sha256
